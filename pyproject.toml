[tool.poetry]
name = "VerificaEstCA"
version = "1.0.4"
description = "Programa para o cálculo das armaduras longitudinais de uma viga de concreto armado de geometria retangular"
authors = ["Caio Guimarães <caio@biscaino.com,br>", "Isadora Daniel <isadsantos03@gmail.com>", "João Ballardin <joaoballardin2292@gmail.com>]
license = "MIT"
readme = "README.md"
packages = [{ include = "VerificaEstCA", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
ipykernel = ">=6,<7"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

